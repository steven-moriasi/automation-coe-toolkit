name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: mypy src tests
      - run: >-
          pytest --cov=automation_coe_toolkit --cov-report=term-missing
          --cov-report=xml --cov-fail-under=80
      - run: pip-audit
      - run: mkdir -p build
      - run: >-
          coe-toolkit evaluate examples/sample-intake.json
          --report-output build/assessment.md
          --json-output build/assessment.json
      - run: >-
          coe-toolkit run-access-review examples/access-review-requests.json
          --as-of 2026-09-01 --output build/access-review-plan.json

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: automation-coe-toolkit:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: >-
          docker run --rm automation-coe-toolkit:test
          evaluate examples/sample-intake.json
      - run: >-
          docker run --rm automation-coe-toolkit:test
          run-access-review examples/access-review-requests.json
          --as-of 2026-09-01
