name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: mypy src tests
      - run: >-
          pytest --cov=automation_coe_toolkit --cov-report=term-missing
          --cov-report=xml --cov-fail-under=80
      - run: pip-audit
      - run: mkdir -p build
      - run: >-
          coe-toolkit evaluate examples/sample-intake.json
          --report-output build/assessment.md
          --json-output build/assessment.json
      - run: >-
          coe-toolkit run-access-review examples/access-review-requests.json
          --as-of 2026-09-01 --output build/access-review-plan.json

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: automation-coe-toolkit:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: >-
          docker run --rm automation-coe-toolkit:test
          evaluate examples/sample-intake.json
      - run: >-
          docker run --rm automation-coe-toolkit:test
          run-access-review examples/access-review-requests.json
          --as-of 2026-09-01
